name: Check Build Documentation Site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: LikeC4 code generation
        uses: likec4/actions@d36a6b8c87c1d540a3737302808755db435183b0 # v1.89.0
        with:
          codegen: react
          path: likec4_src
          output: likec4_react/likec4.generated.js

      - name: LikeC4 PNG export
        uses: likec4/actions@d36a6b8c87c1d540a3737302808755db435183b0 # v1.89.0
        with:
          export: png
          path: likec4_src
          output: public/images/likec4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Check build
        run: npm run build
